[package]
name = "qingluan-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

# Lib-only: the server runs via the unified CLI entry (`qingluan daemon start`).

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
libc = "0.2"
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
include_dir.workspace = true
qingluan-config = { path = "../qingluan-config" }
qingluan-core = { path = "../qingluan-core" }
qingluan-protocol = { path = "../qingluan-protocol" }
qingluan-terminal = { path = "../qingluan-terminal" }

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"
