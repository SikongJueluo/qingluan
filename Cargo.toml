[workspace]
resolver = "2"
members = [
  "crates/qingluan-core",
  "crates/qingluan-protocol",
  "crates/qingluan-config",
  "crates/qingluan-cli",
  "crates/qingluan-daemon",
  "crates/qingluan-sandbox",
  "crates/qingluan-storage",
  "crates/qingluan-terminal",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
console = "0.15"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "6"
figment = { version = "0.10", features = ["toml", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Storage-local SQLite layer. Pinned exactly (Gate C decision): runtime
# queries only, no `query!` macros, no ORM, no cross-database traits.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }
