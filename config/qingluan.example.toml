# Qingluan configuration example.
#
# Layers (later wins):
#   1. built-in defaults (see below)
#   2. global file:  ~/.config/qingluan/config.toml   ($XDG_CONFIG_HOME honored)
#   3. project file: ./qingluan.toml                  (current directory only)
#   4. environment:  QINGLUAN_*                       (nested keys use "__",
#                    e.g. QINGLUAN_DAEMON__PORT=47200)
#
# Missing files fall through to defaults. Malformed files, unknown keys, or
# wrong types are hard errors — typos never silently do nothing.

[workspace]
# Root directory for `qingluan workspace add` destinations:
#   <root>/<repo-name>/<workspace-name>
# A leading "~" expands to the user's home directory.
# Consumed by: qingluan workspace add
root = "~/Projects/.workspace"   # ← built-in default

[daemon]
# HTTP listen address. Consumed by: qingluan daemon start (bind) and
# qingluan health (default --daemon-url). Use 0.0.0.0 to accept LAN
# connections; the CLI maps that back to 127.0.0.1 for local client calls.
# Terminal gRPC remains local-only on terminal.socket_path.
host = "127.0.0.1"
port = 47129

[terminal]
# Local-only gRPC endpoint and durable terminal state. The parent directory
# must be private (0700); the socket itself is created as 0600.
# socket_path = "/run/user/1000/qingluan/daemon.sock"
# storage_root = "~/.local/state/qingluan/terminal"
session_limit = 8
global_limit = 32
# Must be unique for daemon instances sharing one delegated cgroup scope.
cgroup_tag = "qingluan-terminal"
lease_ttl_seconds = 30 # valid range: 1..=86400; clients renew every 10 s
max_message_bytes = 1048576

[sandbox]
# NOT yet consumed — schema reserved for the task execution engine.
provider = "local"
# template = "qingluan-dev"

[cube]
# NOT yet consumed — schema reserved for the task execution engine.
# endpoint = "http://127.0.0.1:8000"
# api_key = "env:CUBE_API_KEY"
# template = "qingluan-dev"

[complexity]
# Defaults for `qingluan complexity`.
# Rows in the human-readable top-K table (--top overrides per run).
top = 10
# A function counts as over threshold above these (Sonar S1541 / S3776).
cc_threshold = 10
cognitive_threshold = 15
# Extra exclude globs, on top of the built-in generated/vendor list.
# exclude = ["**/fixtures/**"]
# Include globs; empty means every file with a bundled grammar.
# include = ["crates/**"]
