# Throwaway hybrid storage/recovery probe (probe C, foundation only). NOT
# production code; kept out of the repo workspace like probes/terminal/{grpc,pty}/rust.
# sqlx is pinned to the Gate 0 confirmed version and used with runtime queries
# plus a runtime-loaded Migrator only: no query! macros, no ORM.
[workspace]

[package]
name = "qingluan-terminal-storage-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
crc32fast = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[[bin]]
name = "qingluan-terminal-storage-probe"
path = "src/main.rs"
