# Throwaway PTY lifecycle/Stop-barrier probe (probe B). NOT production code;
# kept out of the repo workspace like probes/terminal/grpc/rust.
[workspace]

[package]
name = "qingluan-terminal-pty-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
nix = { version = "=0.31.3", features = ["process", "signal", "term", "ioctl"] }
pty-process = { version = "=0.5.3", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "qingluan-terminal-pty-probe"
path = "src/main.rs"

[[bin]]
name = "pty-fixture"
path = "src/bin/pty_fixture.rs"
