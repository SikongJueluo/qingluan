[advisories]
version = 2
ignore = [
    # unic-* crates are unmaintained but are transitive deps of Tauri (via urlpattern).
    # No safe upgrade available; Tauri upstream needs to migrate to icu_*.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # gtk-rs GTK3 bindings unmaintained — transitive dep of Tauri on Linux.
    # No safe upgrade; Tauri needs to migrate to GTK4.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # proc-macro-error unmaintained — transitive dep of Tauri (via derive_more).
    "RUSTSEC-2024-0370",
    # unic-char-property unmaintained — transitive dep of Tauri.
    "RUSTSEC-2025-0081",
    # quick-xml vulnerabilities — transitive dep of Tauri.
    # Fixed in newer quick-xml but Tauri hasn't upgraded yet.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
