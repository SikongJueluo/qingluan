name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Install frontend dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      # `tauri::generate_context!` requires frontendDist to exist on disk,
      # so the bundle must be built before clippy/test compile qingluan-desktop.
      - name: Build frontend bundle
        working-directory: apps/web
        run: bun run build-only

      - name: Rust quality
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets

      - name: Terminal gRPC interoperability
        run: bash tests/terminal-grpc-interop/run.sh

      - name: Terminal TypeScript client quality
        run: |
          pnpm --dir packages/qingluan-client install --frozen-lockfile
          pnpm --dir packages/qingluan-client run typecheck
          pnpm --dir packages/qingluan-client test
          bash packages/qingluan-client/scripts/e2e.sh

      - name: Frontend quality
        working-directory: apps/web
        run: bun run quality
